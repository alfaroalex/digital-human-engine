[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-human-engine"
version = "0.10.1"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "pyright==1.1.414",
    "pre-commit==4.6.2",
]

[tool.setuptools]
packages = ["digital_human"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["digital_human"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
